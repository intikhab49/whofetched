<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340"
     viewBox="0 0 1200 340" role="img"
     aria-label="whofetched: find out which AI actually fetched your page. Give each AI app a secret link,
     ask it to read it, and see who shows up. In tests on 9 October 2026, Grok fetched one page from up to
     12 different IP addresses; ChatGPT, Claude and Gemini each used one.">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="55%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#FF4E88"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B4A" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0A0A14" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0 L0 0 0 28" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="340" fill="#0A0A14"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <circle cx="1040" cy="70" r="240" fill="url(#fade)"/>

  <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="13" letter-spacing="3.5" fill="#A3E635">CANARY-URL ATTRIBUTION &#183; AI FETCHERS</text>

  <text x="60" y="164" font-family="Georgia,'Times New Roman',serif"
        font-size="68" font-weight="700" fill="url(#grad)">whofetched</text>

  <text x="64" y="204" font-family="-apple-system,Segoe UI,Helvetica,sans-serif"
        font-size="19" fill="#E8E8F0">Find out which AI actually fetched your page.</text>
  <text x="64" y="232" font-family="-apple-system,Segoe UI,Helvetica,sans-serif"
        font-size="19" fill="#8B8BA7">Secret link &#8594; ask the AI to read it &#8594; see who shows up.</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
    <rect x="64" y="262" width="172" height="28" rx="14" fill="none" stroke="#FFB020" stroke-opacity="0.55"/>
    <text x="150" y="281" fill="#FFB020" text-anchor="middle">CLOUDFLARE WORKER</text>

    <rect x="248" y="262" width="150" height="28" rx="14" fill="none" stroke="#A3E635" stroke-opacity="0.55"/>
    <text x="323" y="281" fill="#A3E635" text-anchor="middle">HMAC CANARIES</text>

    <rect x="410" y="262" width="158" height="28" rx="14" fill="none" stroke="#5B9BFF" stroke-opacity="0.55"/>
    <text x="489" y="281" fill="#5B9BFF" text-anchor="middle">6 AI APPS TESTED</text>

    <rect x="580" y="262" width="168" height="28" rx="14" fill="none" stroke="#FF4E88" stroke-opacity="0.55"/>
    <text x="664" y="281" fill="#FF4E88" text-anchor="middle">TIMESTAMPED DATA</text>
  </g>

  <text x="820" y="74" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"
        font-size="11" letter-spacing="2" fill="#8B8BA7">IPs THAT FETCHED ONE PAGE &#183; 9 OCT 2026</text>
  <g>
    <rect x="820" y="92.0" width="189.2" height="38.5" rx="3" fill="url(#grad)" opacity="1"/>
    <text x="1019.2" y="115.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#FFFFFF" font-weight="700">12  Grok</text>
    <rect x="820" y="144.5" width="15.8" height="38.5" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="845.8" y="167.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B8BA7" font-weight="400">1  Gemini</text>
    <rect x="820" y="197.0" width="15.8" height="38.5" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="845.8" y="220.2" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B8BA7" font-weight="400">1  ChatGPT</text>
    <rect x="820" y="249.5" width="15.8" height="38.5" rx="3" fill="#8B8BA7" opacity="0.35"/>
    <text x="845.8" y="272.8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8B8BA7" font-weight="400">1  Claude</text>
  </g>
</svg>
